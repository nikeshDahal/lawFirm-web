name: Deploy Web to Ubuntu

on:
  push:
    branches:
      - predevelopment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/lawFirm-web
            echo "📥 Pulling latest code..."
            git pull origin predevelopment
            echo "📦 Installing dependencies..."
            npm install --force
            echo "🏗 Building project..."
            npm run build
            echo "🔄 Reloading PM2..."
            pm2 reload lawfirm-web || pm2 start dist/main.js --name lawfirm-web
            pm2 save
            echo "✅ Deployment completed!"