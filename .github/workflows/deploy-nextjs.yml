name: Deploy Top Legal Advisers Client Site

on:
  push:
    branches:
      - predevelopment

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_API: ${{ secrets.NEXT_PUBLIC_API }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --force

      - name: Build project
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/lawFirm-web

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/predevelopment

            echo "🧹 Cleaning old build..."
            rm -rf node_modules .next

            echo "📦 Installing dependencies..."
            npm install --force

            echo "🏗 Building project..."
            npm run build

            echo "🛑 Stopping old PM2 process..."
            pm2 delete lawfirm-web || true

            echo "▶️ Starting new PM2 process..."
            pm2 start npm --name lawfirm-web -- start

            pm2 save

            echo "✅ Deployment completed successfully!"
