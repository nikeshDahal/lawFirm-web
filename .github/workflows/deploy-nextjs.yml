name: Deploy Top Legal Advisers Next.js App

on:
  push:
    branches:
      - predevelopment

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_API: ${{ secrets.NEXT_PUBLIC_API }}

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 3️⃣ Install dependencies locally
      - name: Install dependencies
        run: npm install --force

      # 4️⃣ Build Next.js project
      - name: Build Next.js
        run: npm run build

      # 5️⃣ Debug - check files before copying
      - name: List files
        run: ls -la

      # 6️⃣ Copy build and public folder to server
      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: |
            .next
            package.json
            package-lock.json
            public
          target: /root/lawFirm-web

      # 7️⃣ Stop old PM2 process, install dependencies on server, and start fresh
      - name: Restart PM2 on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/lawFirm-web

            echo "🛑 Stopping old PM2 process..."
            pm2 delete lawfirm-web || true

            echo "📦 Installing dependencies on server..."
            npm install --force

            echo "▶️ Starting PM2 process fresh..."
            pm2 start npm --name lawfirm-web -- start

            pm2 save

            echo "✅ Deployment completed successfully!"
